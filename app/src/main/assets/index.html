<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14274a"><title>BillNexa • Billing Studio</title><style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#17243b;--muted:#65758b;--blue:#245de5;--line:#e2e8f0;--green:#087d67}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-weight:650;background:#eaf0fc;color:#254b9b}button.primary{background:var(--blue);color:white}button.danger{background:#fff0f0;color:#b42335}button.ghost{background:transparent;color:var(--muted);padding:8px}button:disabled{opacity:.5;cursor:not-allowed}header{background:#14274a;color:white;padding:18px max(20px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:23px;letter-spacing:-.7px}header small{display:block;color:#b3c6eb;font-size:11px;letter-spacing:1.2px;margin-top:3px}.brand{display:flex;align-items:center;gap:12px}.logo{background:#3569ef;border-radius:13px;width:42px;height:42px;display:grid;place-items:center;font-size:25px}header button{background:#34527d;color:white;white-space:nowrap}main{max-width:1100px;margin:auto;padding:24px 20px 105px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:4px}nav button{background:transparent;color:#69788e;min-width:0;flex:1;max-width:150px;padding:8px 3px;font-size:11px;display:grid;gap:3px;place-items:center}nav button span{font-size:20px;line-height:1}nav button.active{color:var(--blue);background:#edf3ff}h1{font-size:26px;letter-spacing:-.8px;margin:0 0 6px}h2{font-size:17px;margin:0 0 13px}h3{font-size:15px;margin:0 0 7px}p{margin:0 0 12px;color:var(--muted);line-height:1.5}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:19px;margin-bottom:15px;box-shadow:0 4px 14px #14274a06}.hero{background:linear-gradient(125deg,#173768,#245de5);color:white;border:0;padding:24px}.hero p{color:#d7e5ff}.hero button{background:white;color:#245de5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats .card{margin:0}.stat{font-size:24px;font-weight:750;letter-spacing:-.6px;overflow-wrap:anywhere}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--muted);margin-bottom:8px}.muted{color:var(--muted);font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.space{justify-content:space-between}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}.row:last-child{border-bottom:0;padding-bottom:0}.row:first-child{padding-top:0}.row>div:first-child{min-width:0;overflow-wrap:anywhere}.tag{display:inline-block;border-radius:30px;padding:4px 9px;font-size:11px;font-weight:700;background:#eef2f8;color:#52637b}.tag.paid{background:#e0f7ed;color:#087d67}.tag.partial{background:#fff0d5;color:#925800}.tag.unpaid{background:#ffe9eb;color:#b42335}.right{text-align:right}.field{display:grid;gap:6px;margin-bottom:12px;min-width:0}label{font-size:12px;font-weight:700;color:#52637b}input,select,textarea{width:100%;min-width:0;border:1px solid #d7e0ed;border-radius:10px;background:#fbfdff;color:var(--ink);padding:11px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #245de514}textarea{resize:vertical;min-height:75px}.item{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}.item .grid{gap:8px}.item .field{margin-bottom:7px}.summary .row{padding:9px 0}.summary .total{font-size:21px;font-weight:750;color:var(--blue)}.empty{text-align:center;padding:25px 10px;color:var(--muted)}.notice{font-size:12px;color:#65758b;background:#edf3ff;border-radius:10px;padding:11px;margin:9px 0}.hidden{display:none!important}.invoice-paper{background:white;color:#182234;padding:24px;border:1px solid var(--line);border-radius:12px;overflow-wrap:anywhere}.invoice-paper h1{font-size:27px;color:#173768}.invoice-paper table{width:100%;border-collapse:collapse;font-size:12px;margin:18px 0}.invoice-paper th,.invoice-paper td{padding:9px 5px;text-align:right;border-bottom:1px solid #e2e8f0;vertical-align:top}.invoice-paper th:first-child,.invoice-paper td:first-child{text-align:left}.invoice-paper th{background:#173768;color:white}.invoice-paper .total{font-size:20px;font-weight:800}.invoice-paper .grid{gap:16px}.invoice-paper p{white-space:pre-wrap;color:#46546a;font-size:12px}.invoice-paper .line{display:flex;justify-content:space-between;gap:8px;padding:4px 0}.invoice-paper .billhead{border-bottom:3px solid #245de5;padding-bottom:15px;margin-bottom:20px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#14274a;color:white;border-radius:12px;padding:12px 18px;z-index:9;max-width:90%;text-align:center}.search{margin-bottom:15px}.spacer{height:16px}.small{font-size:12px;padding:8px 11px}.pre{white-space:pre-wrap}.full{width:100%}@media(min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.editlayout{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start}.item .grid{grid-template-columns:repeat(4,minmax(0,1fr))}.invoice-paper{padding:40px}.invoice-paper table{font-size:14px}}@media(max-width:380px){main{padding-left:12px;padding-right:12px}.card{padding:14px}.invoice-paper{padding:12px}.stat{font-size:20px}}@page{size:A4;margin:12mm}@media print{html,body{background:white!important;margin:0!important}body>*{display:none!important}#printArea{display:block!important}#printArea .invoice-paper{border:0;padding:0;border-radius:0;box-shadow:none}#printArea table{font-size:11px}#printArea tr{break-inside:avoid}#printArea thead{display:table-header-group}#printArea .billhead{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Premium Saffron invoice: isolated from the original blue app navigation. */
.invoice-paper{--inv-orange:#ff9933;--inv-dark:#9a3412;--inv-line:#f1d5b5;position:relative;background:#fff;color:#342518;border:1px solid var(--inv-line);border-top:6px solid var(--inv-orange);border-radius:16px;box-shadow:0 12px 30px #7c2d1210;padding:22px;overflow-wrap:anywhere}
.invoice-paper .billhead{border-bottom:2px solid #ff9933;padding-bottom:18px;margin-bottom:18px}
.invoice-paper h1{color:#7c2d12;font-size:clamp(22px,5vw,30px);line-height:1.16}
.invoice-paper h2{color:#9a3412;font-size:15px;letter-spacing:.5px}
.invoice-paper .eyebrow{color:#9a3412}
.invoice-paper .billhead .right{background:#fff5e9;border-radius:10px;padding:10px}
.invoice-paper p{color:#625449;line-height:1.55}
.invoice-paper table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:11px}
.invoice-paper th{background:#b45309;color:#fff;font-weight:700;padding:10px 4px}
.invoice-paper th:first-child{border-radius:8px 0 0 0}.invoice-paper th:last-child{border-radius:0 8px 0 0}
.invoice-paper td{border-bottom:1px solid #f1e2d2;padding:11px 4px}
.invoice-paper tbody tr:nth-child(even){background:#fff8ef}
.invoice-paper .line{padding:7px 0;align-items:center}
.invoice-paper .line.total{background:#fff0dc;border:1px solid #f2c38a!important;border-radius:10px;padding:12px 9px!important;color:#7c2d12;font-size:19px;gap:5px}
.invoice-paper .tag.paid{background:#e4f6eb;color:#08754a}
.invoice-paper .invoice-footer{border-top:1px solid #f1d5b5;margin-top:20px;padding-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.invoice-paper .invoice-footer p{margin:0}
.invoice-paper .inv-label{font-size:10px;letter-spacing:1.4px;font-weight:750;color:#b45309;margin-bottom:8px}
.invoice-export{background:white;border:1px solid #f1d5b5;padding:14px;border-radius:16px;margin-bottom:16px}
.invoice-export .export-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.invoice-export .export-grid button{background:#fff2e1;color:#8a3709;border:1px solid #f4d1a7;font-size:12px;min-height:44px}
.invoice-export .export-grid button.primary{background:#b45309;color:#fff;border-color:#b45309}
.invoice-export .export-grid button:last-child{grid-column:1/-1}
.invoice-export .actions{margin-top:10px}
@media(min-width:720px){.invoice-paper{padding:38px}.invoice-paper table{font-size:14px}}
@media(max-width:380px){.invoice-paper{padding:12px}.invoice-paper table{font-size:10px}.invoice-paper th,.invoice-paper td{padding:8px 3px}}
@media print{.invoice-paper{box-shadow:none;border-radius:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}}

.app-credit{text-align:center;color:#65758b;font-size:11px;letter-spacing:.15px;margin:22px 0 6px;padding:12px 0;border-top:1px solid #e2e8f0}
.policy-card section{margin:18px 0}.policy-card section h2{font-size:15px;margin-bottom:8px}.policy-card p{line-height:1.65;overflow-wrap:anywhere}
@media print{.app-credit{display:none!important}}
</style></head><body><header><div class="brand"><div class="logo">▤</div><div><strong>BillNexa</strong><small>BILLING STUDIO</small></div></div><button onclick="newInvoice()">＋ New bill</button></header><main id="main"></main><nav id="nav"></nav><div id="printArea" class="hidden"></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="restoreFile" accept="application/json,.json" class="hidden"><script>
'use strict';
const KEY='billnexa-v1';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n||0);const round=n=>Math.round((n+Number.EPSILON)*100)/100;const num=v=>Math.max(0,Number(v)||0);const defaultData=()=>({version:1,business:{name:'',address:'',phone:'',email:'',gstin:'',state:'Gujarat',bank:'',upi:'',prefix:'INV'},customers:[],products:[],invoices:[],next:1});let db=defaultData();try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x.version===1)db=x}}catch(e){}let screen='home',draft=null,viewId=null,editing=null,filter='all',search='',toastTimer;const tabs=[['home','⌂','Home'],['invoices','▤','Bills'],['customers','♙','Customers'],['products','▦','Items'],['settings','⚙','More']];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save data. Please free storage and try again.');return false}}function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}function go(s){if(screen==='edit'&&s!=='edit'&&draft&&!confirm('Leave this unsaved bill?'))return;draft=null;editing=null;search='';filter='all';screen=s;render();window.scrollTo(0,0)}function render(){ $('nav').innerHTML=tabs.map(([s,i,l])=>`<button class="${screen===s||(s==='invoices'&&['edit','preview'].includes(screen))||(s==='products'&&screen==='productstudio')?'active':''}" onclick="go('${s}')"><span>${i}</span>${l}</button>`).join('');const f={home:home,invoices:invoices,customers:()=>directory('customers'),products:()=>directory('products'),settings:settings,edit:edit,preview:preview,productstudio:productStudio,privacy:privacyScreen};$('main').innerHTML=f[screen]()+'<footer class="app-credit">Development by Ravi Vadhiya</footer>'; }
function heading(t,p,extra=''){return `<div class="heading"><div><h1>${t}</h1><p>${p}</p></div>${extra}</div>`}function field(label,id,value='',type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}function area(label,id,value=''){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}">${esc(value)}</textarea></div>`}function get(id){return $(id).value.trim()}function select(label,id,opts,value,extra=''){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" ${extra}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
function totals(i){const lines=i.items.map(x=>{const gross=round(num(x.qty)*num(x.rate));const discount=round(gross*Math.min(100,num(x.discount))/100);const base=round(gross-discount);const tax=i.taxMode==='none'?0:round(base*num(x.gst)/100);return {gross,discount,base,tax,total:round(base+tax)}});const sum=k=>round(lines.reduce((a,x)=>a+x[k],0));const total=sum('total'),paid=Math.min(total,round(num(i.paid)));return {lines,base:sum('base'),discount:sum('discount'),tax:sum('tax'),total,paid,due:round(total-paid)}}function status(i){const t=totals(i);return t.due===0?'Paid':t.paid>0?'Partial':'Unpaid'}function tag(i){const s=status(i);return `<span class="tag ${s.toLowerCase()}">${s}</span>`}function invoiceRow(i){const t=totals(i);return `<div class="row"><div><h3>${esc(i.number)} · ${esc(i.customer.name)}</h3>${i.kind==='product'?'<div class="eyebrow" style="color:#245de5">Product bill</div>':''}<div class="muted">${esc(i.date)} · ${tag(i)}</div></div><div class="right"><strong>${money(t.total)}</strong><br><button class="ghost small" onclick="openInvoice('${esc(i.id)}')">View bill ›</button></div></div>`}
function home(){const total=db.invoices.reduce((a,i)=>a+totals(i).total,0),paid=db.invoices.reduce((a,i)=>a+totals(i).paid,0),due=db.invoices.reduce((a,i)=>a+totals(i).due,0);return `${heading('Business overview',esc(db.business.name||'Manage your business, simply.'))}<div class="card hero"><div class="eyebrow" style="color:#d7e5ff">YOUR BILLING WORKSPACE</div><h1>Make every sale count.</h1><p>Create professional invoices, track payments and manage customers.</p><button onclick="newInvoice()">＋ Create invoice</button></div><div class="grid stats">${[['Total sales',money(total)],['Received',money(paid)],['Outstanding',money(due)],['Total bills',db.invoices.length]].map(([a,b])=>`<div class="card"><div class="eyebrow">${a}</div><div class="stat">${b}</div></div>`).join('')}</div><div class="spacer"></div><div class="card"><h2>Quick actions</h2><div class="grid"><button class="primary" onclick="go('productstudio')">▦ Product Bill Studio</button><button onclick="newInvoice()">＋ New invoice</button><button onclick="go('customers')">Customers</button><button onclick="go('products')">Products & services</button><button onclick="go('settings')">Business profile</button></div></div><div class="card"><div class="actions space"><h2>Recent invoices</h2><button class="ghost" onclick="go('invoices')">View all ›</button></div>${db.invoices.length?db.invoices.slice().reverse().slice(0,5).map(invoiceRow).join(''):'<div class="empty">No invoices yet. Create your first bill.</div>'}</div>`}
function invoices(){return `${heading('Invoices','Find, share and manage your bills.','<button class="primary" onclick="newInvoice()">＋ New</button>')}<input class="search" id="query" placeholder="Search invoice or customer" value="${esc(search)}" oninput="search=this.value;invoiceList()"><div class="actions" style="margin-bottom:14px">${['all','Paid','Partial','Unpaid'].map(v=>`<button class="${filter===v?'primary':''} small" onclick="filter='${v}';render()">${v==='all'?'All':v}</button>`).join('')}</div><div class="card" id="invoiceList">${invoiceListHtml()}</div>`}function invoiceListHtml(){const rows=db.invoices.slice().reverse().filter(i=>(filter==='all'||status(i)===filter)&&`${i.number} ${i.customer.name}`.toLowerCase().includes(search.toLowerCase()));return rows.length?rows.map(invoiceRow).join(''):'<div class="empty">No matching bills.</div>'}function invoiceList(){$('invoiceList').innerHTML=invoiceListHtml()}
function directory(type){const isC=type==='customers';const title=isC?'Customers':'Products & services';const list=db[type];const e=editing&&editing.type===type?list.find(x=>x.id===editing.id):null;return `${heading(title,isC?'Save customer contact and billing details.':'Build your reusable item catalog.',isC?'':'<button class="primary" onclick="go(\'productstudio\')">Product Bill</button>')}<div class="card"><h2>${e?'Edit':'Add'} ${isC?'customer':'item'}</h2>${field('Name *','dname',e?.name)}<div class="grid">${isC?field('Phone','dphone',e?.phone,'tel')+field('GSTIN (optional)','dgstin',e?.gstin):field('Unit price (₹)','drate',e?.rate??0,'number','min="0" step="0.01"')+field('GST %','dgst',e?.gst??0,'number','min="0" max="100" step="0.01"')}</div>${isC?area('Billing address','daddress',e?.address):field('HSN / SAC','dhsn',e?.hsn)+field('Unit','dunit',e?.unit||'pcs')+`<div class="grid">${field('SKU / barcode','dsku',e?.sku||'')}${field('Category','dcategory',e?.category||'')}${field('Default discount %','ddiscount',e?.discount??0,'number','min="0" max="100" step="0.01"')}</div>`}<div class="actions"><button class="primary" onclick="saveDirectory('${type}')">${e?'Update':'Save'}</button>${e?'<button onclick="editing=null;render()">Cancel</button>':''}</div></div><div class="card"><h2>Saved ${isC?'customers':'items'} · ${list.length}</h2>${list.length?list.map(x=>`<div class="row"><div><h3>${esc(x.name)}</h3><div class="muted">${isC?esc(x.phone||x.gstin||'No phone'):money(x.rate)+' · GST '+esc(x.gst)+'%'+(x.sku?' · SKU '+esc(x.sku):'')+(x.category?' · '+esc(x.category):'')}</div></div><div class="actions"><button class="small" onclick="editDirectory('${type}','${esc(x.id)}')">Edit</button><button class="small danger" onclick="deleteDirectory('${type}','${esc(x.id)}')">Delete</button></div></div>`).join(''):'<div class="empty">Nothing saved yet.</div>'}</div>`}
function saveDirectory(type){const name=get('dname');if(!name)return toast('Enter a name');let obj={id:editing?.id||uid(),name};if(type==='customers'){Object.assign(obj,{phone:get('dphone'),gstin:get('dgstin').toUpperCase(),address:get('daddress')})}else{Object.assign(obj,{rate:num(get('drate')),gst:Math.min(100,num(get('dgst'))),hsn:get('dhsn'),unit:get('dunit')||'pcs',sku:get('dsku'),category:get('dcategory'),discount:Math.min(100,num(get('ddiscount')))})}const idx=db[type].findIndex(x=>x.id===obj.id);if(idx<0)db[type].push(obj);else db[type][idx]=obj;persist();editing=null;render();toast('Saved')}function editDirectory(type,id){editing={type,id};render();window.scrollTo(0,0)}function deleteDirectory(type,id){if(!confirm('Delete this saved entry? Existing bills are unchanged.'))return;db[type]=db[type].filter(x=>x.id!==id);editing=null;persist();render()}
function blankItem(){return {name:'',hsn:'',unit:'pcs',qty:1,rate:0,gst:0,discount:0}}function newInvoice(kind='standard',productId=''){if(screen==='edit'&&draft&&!confirm('Discard current unsaved bill?'))return;draft={id:uid(),number:`${db.business.prefix||'INV'}-${String(db.next).padStart(4,'0')}`,date:today(),dueDate:'',taxMode:'none',customer:{name:'',phone:'',gstin:'',address:''},business:JSON.parse(JSON.stringify(db.business)),items:[blankItem()],paid:0,payment:'Cash',notes:'Thank you for your business!',isNew:true,kind};if(kind==='product'){draft.customer.name='Walk-in customer';const p=db.products.find(x=>x.id===productId);if(p)draft.items=[{...blankItem(),...p,qty:1}]}screen='edit';render();window.scrollTo(0,0)}
function edit(){const d=draft;return `${heading(d.kind==='product'?(d.isNew?'Product bill':'Edit product bill'):(d.isNew?'Create invoice':'Edit invoice'),d.kind==='product'?'Retail & wholesale product billing · prices exclude GST':'Add details and calculate your total automatically.')}<div class="editlayout"><div><div class="card"><h2>Invoice details</h2><div class="grid">${field('Invoice number *','number',d.number)+field('Invoice date *','date',d.date,'date')+field('Due date','dueDate',d.dueDate,'date')+select('Tax type','taxMode',[['none','Non-GST'],['local','GST · CGST + SGST'],['inter','GST · IGST']],d.taxMode,'onchange="capture();renderItems()"')}</div></div><div class="card"><h2>Bill to</h2>${select('Choose saved customer','customerPick',[['','Select customer'],...db.customers.map(x=>[x.id,x.name])],'','onchange="pickCustomer(this.value)"')}${field('Customer name *','cname',d.customer.name)}<div class="grid">${field('Phone','cphone',d.customer.phone,'tel')+field('GSTIN','cgstin',d.customer.gstin)}</div>${area('Address','caddress',d.customer.address)}</div><div class="card"><div class="actions space"><h2>Items</h2><button class="small" onclick="addItem()">＋ Item</button></div>${select('Add from catalog','productPick',[['','Select saved product'],...db.products.map(x=>[x.id,x.name])],'','onchange="pickProduct(this.value)"')}${productPicker()}<div id="items">${itemsHtml()}</div></div></div><div><div class="card summary"><h2>Bill summary</h2><div id="sum">${sumHtml()}</div><div class="spacer"></div>${field('Amount received (₹)','paid',d.paid,'number','min="0" step="0.01" oninput="capture();refreshSum()"')}${select('Payment method','payment',[['Cash','Cash'],['UPI','UPI'],['Card','Card'],['Bank transfer','Bank transfer'],['Other','Other']],d.payment)}${d.kind==='product'?'<div class="actions" style="margin-bottom:12px"><button onclick="setProductPaid(true)">Full payment</button><button onclick="setProductPaid(false)">Unpaid</button></div>':''}${area('Notes / terms','notes',d.notes)}<button class="primary full" onclick="saveInvoice()">Save & preview invoice</button><div class="notice">GST is calculated on discounted, tax-exclusive item prices. Select the correct tax type for your supply.</div></div></div></div>`}
function itemsHtml(){return draft.items.map((x,i)=>`<div class="item"><div class="actions space"><h3>Item ${i+1}</h3><button class="ghost small" onclick="removeItem(${i})">Remove</button></div>${field('Description *',`name${i}`,x.name,'text','oninput="updateItems()"')}${draft.kind==='product'?field('SKU / barcode',`sku${i}`,x.sku||'')+'<div class="actions" style="margin-bottom:10px"><button class="small" onclick="changeProductQty('+i+',-1)">−</button><button class="small" onclick="changeProductQty('+i+',1)">＋</button></div>':''}<div class="grid">${field('Qty',`qty${i}`,x.qty,'number','min="0.001" step="0.001" oninput="updateItems()"')+field('Rate ₹',`rate${i}`,x.rate,'number','min="0" step="0.01" oninput="updateItems()"')+field('Discount %',`discount${i}`,x.discount,'number','min="0" max="100" oninput="updateItems()"')+(draft.taxMode==='none'?'':field('GST %',`gst${i}`,x.gst,'number','min="0" max="100" step="0.01" oninput="updateItems()"'))+field('HSN / SAC',`hsn${i}`,x.hsn)+field('Unit',`unit${i}`,x.unit)}</div></div>`).join('')}
function capture(){if(!$('number'))return;Object.assign(draft,{number:get('number'),date:get('date'),dueDate:get('dueDate'),taxMode:get('taxMode'),paid:num(get('paid')),payment:get('payment'),notes:get('notes'),customer:{name:get('cname'),phone:get('cphone'),gstin:get('cgstin').toUpperCase(),address:get('caddress')}});draft.items.forEach((x,i)=>{for(const k of ['name','hsn','unit','sku'])if($(k+i))x[k]=get(k+i);for(const k of ['qty','rate','discount','gst'])if($(k+i))x[k]=['discount','gst'].includes(k)?Math.min(100,num(get(k+i))):num(get(k+i))})}
function updateItems(){capture();refreshSum()}function sumHtml(){const t=totals(draft);return `<div class="row"><span>Taxable / net amount</span><strong>${money(t.base)}</strong></div><div class="row"><span>Discount</span><strong>${money(t.discount)}</strong></div>${draft.taxMode==='local'?`<div class="row"><span>CGST</span><strong>${money(round(t.tax/2))}</strong></div><div class="row"><span>SGST</span><strong>${money(round(t.tax-round(t.tax/2)))}</strong></div>`:draft.taxMode==='inter'?`<div class="row"><span>IGST</span><strong>${money(t.tax)}</strong></div>`:''}${draft.kind==='product'?productTaxSummary(draft):''}<div class="row total"><span>Total</span><span>${money(t.total)}</span></div><div class="row"><span>Balance due</span><strong>${money(t.due)}</strong></div>`}function refreshSum(){$('sum').innerHTML=sumHtml()}function renderItems(){$('items').innerHTML=itemsHtml();refreshSum()}function addItem(){capture();draft.items.push(blankItem());renderItems()}function removeItem(i){capture();draft.items.splice(i,1);if(!draft.items.length)draft.items.push(blankItem());renderItems()}function pickCustomer(id){capture();const c=db.customers.find(x=>x.id===id);if(c){draft.customer={...c};render()}}function pickProduct(id){capture();const p=db.products.find(x=>x.id===id);if(p){const x={...blankItem(),...p,qty:1};if(draft.items.length===1&&!draft.items[0].name)draft.items[0]=x;else draft.items.push(x);if($('productPick'))$('productPick').value='';renderItems();toast('Product added to bill')}}
function saveInvoice(){capture();const d=draft;if(!d.number||!d.date||!d.customer.name||d.items.some(x=>!x.name||x.qty<=0))return toast('Enter invoice number, date, customer and valid items.');if(d.dueDate&&d.dueDate<d.date)return toast('Due date cannot be before invoice date.');if(db.invoices.some(x=>x.id!==d.id&&x.number.toLowerCase()===d.number.toLowerCase()))return toast('Invoice number already exists.');if(d.taxMode!=='none'&&(!d.business.name||!d.business.gstin))return toast('Set business name and GSTIN in More before creating a GST bill.');if(d.paid>totals(d).total)return toast('Received amount cannot exceed bill total.');const i=JSON.parse(JSON.stringify(d));delete i.isNew;const ix=db.invoices.findIndex(x=>x.id===i.id);if(ix===-1){db.invoices.push(i);db.next++}else db.invoices[ix]=i;if(!persist())return;draft=null;openInvoice(i.id);toast('Invoice saved')}
function openInvoice(id){viewId=id;screen='preview';draft=null;render();window.scrollTo(0,0)}function paper(i){const t=totals(i),b=i.business,c=i.customer;return `<article class="invoice-paper"><div class="inv-label">BUSINESS INVOICE</div><div class="billhead"><div class="grid"><div><h1>${esc(b.name||'Your Business')}</h1><p>${esc(b.address)}${b.phone?'\nPhone: '+esc(b.phone):''}${b.email?'\n'+esc(b.email):''}${b.gstin?'\nGSTIN: '+esc(b.gstin):''}${b.state?'\n'+esc(b.state):''}</p></div><div class="right"><h2>${i.kind==='product'?(i.taxMode==='none'?'PRODUCT INVOICE':'PRODUCT TAX INVOICE'):(i.taxMode==='none'?'INVOICE':'TAX INVOICE')}</h2><p>No. ${esc(i.number)}\nDate: ${esc(i.date)}${i.dueDate?'\nDue: '+esc(i.dueDate):''}</p></div></div></div><div class="grid"><div><div class="eyebrow">Bill to</div><h3>${esc(c.name)}</h3><p>${esc(c.address)}${c.phone?'\nPhone: '+esc(c.phone):''}${c.gstin?'\nGSTIN: '+esc(c.gstin):''}</p></div><div class="right"><div class="eyebrow">Payment status</div>${tag(i)}<p>${esc(i.payment)}</p></div></div><table><thead><tr><th>Item / HSN</th><th>Qty</th><th>Rate</th><th>Disc.</th>${i.taxMode!=='none'?'<th>GST</th>':''}<th>Amount</th></tr></thead><tbody>${i.items.map((x,j)=>`<tr><td><strong>${esc(x.name)}</strong>${x.hsn?'<br>HSN: '+esc(x.hsn):''}${i.kind==='product'&&x.sku?'<br>SKU: '+esc(x.sku):''}</td><td>${esc(x.qty)} ${esc(x.unit)}</td><td>${money(x.rate)}</td><td>${esc(x.discount)}%</td>${i.taxMode!=='none'?`<td>${esc(x.gst)}%</td>`:''}<td>${money(t.lines[j].total)}</td></tr>`).join('')}</tbody></table>${i.kind==='product'?productTaxSummary(i):''}<div class="line"><span>Discount</span><strong>${money(t.discount)}</strong></div><div class="line"><span>Net amount</span><strong>${money(t.base)}</strong></div>${i.taxMode==='local'?`<div class="line"><span>CGST</span><strong>${money(round(t.tax/2))}</strong></div><div class="line"><span>SGST</span><strong>${money(round(t.tax-round(t.tax/2)))}</strong></div>`:i.taxMode==='inter'?`<div class="line"><span>IGST</span><strong>${money(t.tax)}</strong></div>`:''}<div class="line total" style="border-top:1px solid #bbc9da;margin-top:9px;padding-top:12px"><span>Grand total</span><span>${money(t.total)}</span></div><div class="line"><span>Received</span><strong>${money(t.paid)}</strong></div><div class="line"><span>Balance due</span><strong>${money(t.due)}</strong></div>${b.bank||b.upi?`<div class="spacer"></div><h3>Payment details</h3><p>${esc(b.bank)}${b.upi?'\nUPI: '+esc(b.upi):''}</p>`:''}${i.notes?`<div class="spacer"></div><h3>Notes / terms</h3><p>${esc(i.notes)}</p>`:''}<div class="invoice-footer"><div><p>Thank you for your business.</p><div class="inv-label">BILLNEXA</div></div><div class="right"><p>Authorised signatory<br>${esc(b.name||'')}</p></div></div></article>`}function preview(){const i=db.invoices.find(x=>x.id===viewId);if(!i)return heading('Invoice not found','');return `${heading('Invoice preview',esc(i.number))}<div class="invoice-export"><h2>Export invoice</h2><p>Print-ready PDF · HD JPG (300 DPI equivalent)</p><div class="export-grid"><button class="primary" onclick="exportBillPdf('save')">↓ Download PDF</button><button onclick="exportBillPdf('share')">Share PDF</button><button onclick="exportBillJpg('save')">↓ Save JPG</button><button onclick="exportBillJpg('share')">Share JPG</button><button onclick="exportBillPdf('print')">Print A4</button></div><div class="actions"><button class="small" onclick="editInvoice()">Edit bill</button><button class="small" onclick="recordPayment()">Record payment</button><button class="small" onclick="shareInvoice()">Share summary</button><button class="small danger" onclick="deleteInvoice()">Delete</button></div></div>${paper(i)}`}function printInvoice(){const i=db.invoices.find(x=>x.id===viewId);$('printArea').innerHTML=paper(i);if(window.BillNexaNative)window.BillNexaNative.printInvoice(i.number,'<!doctype html><html><head><meta charset="utf-8"><style>'+document.querySelector("style").textContent+' @media print{body>#printArea{display:block!important}} </style></head><body><div id="printArea">'+paper(i)+'</div></body></html>');else window.print()}function shareInvoice(){const i=db.invoices.find(x=>x.id===viewId),t=totals(i);const text=`${i.business.name||'Invoice'}\nInvoice: ${i.number}\nDate: ${i.date}\nCustomer: ${i.customer.name}\n${i.items.map(x=>`${x.name} × ${x.qty}`).join('\n')}\nTotal: ${money(t.total)}\nReceived: ${money(t.paid)}\nBalance: ${money(t.due)}${i.business.upi?'\nUPI: '+i.business.upi:''}`;if(window.BillNexaNative)window.BillNexaNative.shareText(text);else if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Summary copied')).catch(()=>prompt('Copy invoice summary',text));else prompt('Copy invoice summary',text)}function editInvoice(){draft=JSON.parse(JSON.stringify(db.invoices.find(x=>x.id===viewId)));draft.isNew=false;screen='edit';render();window.scrollTo(0,0)}function recordPayment(){const i=db.invoices.find(x=>x.id===viewId),t=totals(i);if(!t.due)return toast('Invoice already paid');const v=prompt(`Enter additional payment (balance ${money(t.due)})`,String(t.due));if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<=0||n>t.due)return toast('Enter a valid payment within the balance.');i.paid=round(t.paid+n);persist();render();toast('Payment recorded')}function deleteInvoice(){if(!confirm('Permanently delete this invoice?'))return;db.invoices=db.invoices.filter(x=>x.id!==viewId);persist();go('invoices')}
function settings(){const b=db.business;return `${heading('More','Business settings and local data management.')}<div class="card"><h2>Business profile</h2>${field('Business name','bname',b.name)}${area('Address','baddress',b.address)}<div class="grid">${field('Phone','bphone',b.phone,'tel')+field('Email','bemail',b.email,'email')+field('GSTIN','bgstin',b.gstin)+field('State','bstate',b.state)+field('Invoice prefix','bprefix',b.prefix)+field('UPI ID','bupi',b.upi)}</div>${area('Bank / payment details','bbank',b.bank)}<button class="primary" onclick="saveBusiness()">Save profile</button></div><div class="card"><h2>Backup & restore</h2><p>Data stays on this device. Keep a backup before uninstalling or changing devices.</p><div class="actions"><button onclick="backup()">Export backup</button><button onclick="$('restoreFile').click()">Restore backup</button></div></div><div class="card"><h2>About BillNexa</h2><p>Version 1.4 · Premium Saffron invoice</p><p>GST calculations are a convenience tool, not a guarantee of tax compliance. Verify your invoice requirements with your accountant. No GST portal or e-invoicing integration.</p><div class="actions"><button onclick="go('privacy')">Privacy policy</button></div></div><div class="card"><h2>Data controls</h2><p>Permanently remove saved business, customer, product and invoice records from this app. Files already exported are not removed.</p><button class="danger" onclick="eraseLocalData()">Delete all local data</button></div>`}function saveBusiness(){db.business={name:get('bname'),address:get('baddress'),phone:get('bphone'),email:get('bemail'),gstin:get('bgstin').toUpperCase(),state:get('bstate'),prefix:get('bprefix')||'INV',upi:get('bupi'),bank:get('bbank')};persist();toast('Business profile saved')}function backup(){const data=JSON.stringify(db,null,2);if(window.BillNexaNative){window.BillNexaNative.saveBackup(data);return}const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='billnexa-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validBackup(x){const id=v=>typeof v==='string'&&/^[a-zA-Z0-9-]+$/.test(v);const str=v=>typeof v==='string';const number=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0;const fields=(o,keys)=>o&&keys.every(k=>str(o[k]));const biz=o=>fields(o,['name','address','phone','email','gstin','state','bank','upi','prefix']);const customer=o=>fields(o,['name','phone','gstin','address']);const item=o=>fields(o,['name','hsn','unit'])&&number(o.rate)&&number(o.gst)&&number(o.qty)&&o.qty>0&&number(o.discount);return x&&x.version===1&&biz(x.business)&&Number.isSafeInteger(x.next)&&x.next>0&&Array.isArray(x.customers)&&x.customers.every(o=>customer(o)&&id(o.id))&&Array.isArray(x.products)&&x.products.every(o=>id(o.id)&&fields(o,['name','hsn','unit'])&&number(o.rate)&&number(o.gst))&&Array.isArray(x.invoices)&&x.invoices.every(o=>id(o.id)&&fields(o,['number','date','dueDate','payment','notes'])&&['none','local','inter'].includes(o.taxMode)&&biz(o.business)&&customer(o.customer)&&number(o.paid)&&Array.isArray(o.items)&&o.items.length&&o.items.every(item))} $('restoreFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20000000)throw Error('Large file');const x=JSON.parse(await f.text());if(!validBackup(x))throw Error('Invalid format');if(!confirm('Replace all current billing data with this backup?'))return;const prev=db;db=x;if(!persist()){db=prev;return}go('home');toast('Backup restored')}catch(err){toast('Invalid BillNexa backup file')}});

function productResults(q,where){

function productSearch(q,where){const el=$(where==='studio'?'studioProducts':'editProducts');if(el)el.innerHTML=productResults(q,where)}
function productPicker(){return '<div class="card" style="padding:12px;background:#f5f8ff"><h3>Product search & quick add</h3><div class="actions" style="margin-bottom:12px"><button class="primary" onclick="toggleQuickProduct()">＋ Add new product</button></div><div id="quickProduct" class="hidden"></div><input id="productQuery" class="search" placeholder="Search product name, SKU, HSN or category" oninput="productSearch(this.value,\'edit\')"><div id="editProducts" style="max-height:260px;overflow:auto">'+productResults('','edit')+'</div></div>'}
function changeProductQty(i,step){capture();const x=draft.items[i];if(!x)return;x.qty=Math.max(0.001,Math.round((num(x.qty)+step)*1000)/1000);renderItems()}
function setProductPaid(full){capture();draft.paid=full?totals(draft).total:0;$('paid').value=draft.paid;refreshSum()}
function productTaxSummary(i){
 if(i.taxMode==='none')return '';
 const groups=new Map();const t=totals(i);
 i.items.forEach((x,j)=>{const rate=num(x.gst),g=groups.get(rate)||{base:0,tax:0};g.base=round(g.base+t.lines[j].base);g.tax=round(g.tax+t.lines[j].tax);groups.set(rate,g)});
 return '<div style="margin:14px 0"><h3>GST rate summary</h3><table style="width:100%;font-size:12px"><thead><tr><th>Rate</th><th>Taxable</th><th>GST</th></tr></thead><tbody>'+Array.from(groups).sort((a,b)=>a[0]-b[0]).map(([rate,g])=>'<tr><td>'+esc(rate)+'%</td><td>'+money(g.base)+'</td><td>'+money(g.tax)+'</td></tr>').join('')+'</tbody></table></div>';
}

function pdfPayload(i){
 const t=totals(i),b=i.business,c=i.customer;
 const details=(o,keys)=>keys.map(([k,l])=>o[k]?l+o[k]:'').filter(Boolean);
 const rows=i.items.map((x,j)=>[
 x.name+(x.hsn?'\nHSN: '+x.hsn:'')+(x.sku?'\nSKU: '+x.sku:''),String(x.qty)+' '+x.unit,money(x.rate),String(x.discount)+'%',i.taxMode==='none'?'—':String(x.gst)+'%',money(t.lines[j].total)]);
 const summary=[['Discount',money(t.discount)],['Taxable / net amount',money(t.base)]];
 if(i.taxMode==='local')summary.push(['CGST',money(round(t.tax/2))],['SGST',money(round(t.tax-round(t.tax/2)))]);
 if(i.taxMode==='inter')summary.push(['IGST',money(t.tax)]);
 summary.push(['Grand total',money(t.total)],['Received',money(t.paid)],['Balance due',money(t.due)]);
 return {number:i.number,title:(i.kind==='product'?'PRODUCT ':'')+(i.taxMode==='none'?'INVOICE':'TAX INVOICE'),date:i.date,dueDate:i.dueDate,business:b.name||'Your Business',businessInfo:details(b,[['address',''],['phone','Phone: '],['email','Email: '],['gstin','GSTIN: '],['state','State: ']]),customer:c.name,customerInfo:details(c,[['address',''],['phone','Phone: '],['gstin','GSTIN: ']]),payment:i.payment+' · '+status(i),rows,summary,paymentInfo:details(b,[['bank',''],['upi','UPI: ']]),notes:i.notes||''};
}

function exportBillPdf(action){
 const i=db.invoices.find(x=>x.id===viewId);if(!i)return toast('Save the invoice first.');
 if(window.BillNexaNative&&typeof window.BillNexaNative.exportPdf==='function'){window.BillNexaNative.exportPdf(JSON.stringify(pdfPayload(i)),action);return}
 if(action==='share')return toast('PDF file sharing is available in the updated Android app.');
 printInvoice();
}

function privacyScreen(){return heading('Privacy policy','BillNexa · Updated 26 November 2026','<button onclick="go(\'settings\')">Back</button>')+"<div class=\"card policy-card\"><section><h2>Developer and scope</h2><p>BillNexa is an offline invoice and billing application developed by Ravi Vadhiya (PixelFire Studio). This policy describes the Android app as distributed in version 1.4.</p></section>\n<section><h2>Information stored on your device</h2><p>You may enter business and customer names, addresses, contact details, GSTIN, product and invoice details, bank/UPI payment instructions, payment amounts and notes. These are used to create and manage invoices and are stored locally in the app. The app does not require an account, include advertising or analytics SDKs, or send these records to a developer server.</p></section>\n<section><h2>Exports, sharing and printing</h2><p>PDF, JPG and JSON backups are generated locally. When you explicitly save, print or share a file, it is handled by the selected Android service or recipient app, whose own privacy practices apply. Temporary export files are stored in the app cache; older export folders are cleaned during subsequent exports. Exported files and backups outside the app remain until you remove them.</p></section>\n<section><h2>Retention and deletion</h2><p>Records remain on your device until you delete them or clear app data. You can delete individual records or use More → Delete all local data. Uninstalling or clearing storage also removes app-private data. Externally saved or shared copies must be deleted separately.</p></section>\n<section><h2>Security</h2><p>App-private storage and read-only, temporary file-sharing permissions protect records from ordinary access by other apps. Records are not separately encrypted by BillNexa. Protect your device, choose trusted recipients and store backups securely.</p></section>\n<section><h2>Children and payments</h2><p>BillNexa is a business productivity tool, not directed to children. It records payment information entered by users; it does not process payments, access bank accounts or provide lending services.</p></section>\n<section><h2>Contact and updates</h2><p>For privacy questions, contact business@pixelfirestudio.in. If the app's data practices change, the policy and Play Data safety disclosures should be updated before distribution.</p></section></div>"}
function eraseLocalData(){
 if(!confirm('Delete all local business, product, customer and invoice records? This cannot be undone. Export a backup first if needed.'))return;
 const old=db;db=defaultData();if(!persist()){db=old;return}
 if(window.BillNexaNative&&typeof window.BillNexaNative.clearExportCache==='function')window.BillNexaNative.clearExportCache();
 go('home');toast('Local billing data deleted');
}
render();
</script></body></html>
