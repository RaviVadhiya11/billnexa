/* Premium Saffron invoice: isolated from the original blue app navigation. */
.invoice-paper{--inv-orange:#ff9933;--inv-dark:#9a3412;--inv-line:#f1d5b5;position:relative;background:#fff;color:#342518;border:1px solid var(--inv-line);border-top:6px solid var(--inv-orange);border-radius:16px;box-shadow:0 12px 30px #7c2d1210;padding:22px;overflow-wrap:anywhere}
.invoice-paper .billhead{border-bottom:2px solid #ff9933;padding-bottom:18px;margin-bottom:18px}
.invoice-paper h1{color:#7c2d12;font-size:clamp(22px,5vw,30px);line-height:1.16}
.invoice-paper h2{color:#9a3412;font-size:15px;letter-spacing:.5px}
.invoice-paper .eyebrow{color:#9a3412}
.invoice-paper .billhead .right{background:#fff5e9;border-radius:10px;padding:10px}
.invoice-paper p{color:#625449;line-height:1.55}
.invoice-paper table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:11px}
.invoice-paper th{background:#b45309;color:#fff;font-weight:700;padding:10px 4px}
.invoice-paper th:first-child{border-radius:8px 0 0 0}.invoice-paper th:last-child{border-radius:0 8px 0 0}
.invoice-paper td{border-bottom:1px solid #f1e2d2;padding:11px 4px}
.invoice-paper tbody tr:nth-child(even){background:#fff8ef}
.invoice-paper .line{padding:7px 0;align-items:center}
.invoice-paper .line.total{background:#fff0dc;border:1px solid #f2c38a!important;border-radius:10px;padding:12px 9px!important;color:#7c2d12;font-size:19px;gap:5px}
.invoice-paper .tag.paid{background:#e4f6eb;color:#08754a}
.invoice-paper .invoice-footer{border-top:1px solid #f1d5b5;margin-top:20px;padding-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.invoice-paper .invoice-footer p{margin:0}
.invoice-paper .inv-label{font-size:10px;letter-spacing:1.4px;font-weight:750;color:#b45309;margin-bottom:8px}
.invoice-export{background:white;border:1px solid #f1d5b5;padding:14px;border-radius:16px;margin-bottom:16px}
.invoice-export .export-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.invoice-export .export-grid button{background:#fff2e1;color:#8a3709;border:1px solid #f4d1a7;font-size:12px;min-height:44px}
.invoice-export .export-grid button.primary{background:#b45309;color:#fff;border-color:#b45309}
.invoice-export .export-grid button:last-child{grid-column:1/-1}
.invoice-export .actions{margin-top:10px}

@media print{.invoice-paper{box-shadow:none;border-radius:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}}

main{width:100%;min-width:0;padding-top:18px;padding-bottom:112px}

.keyboard-open nav{display:none}
.keyboard-open main{padding-bottom:28px}
.keyboard-open .toast{bottom:15px}
.heading,.actions,.row,.brand{min-width:0}
.heading>div,.grid>*,.editlayout>*,.row>div{min-width:0;overflow-wrap:anywhere}
.heading{align-items:flex-start;flex-wrap:wrap;gap:8px}
button,input,select,textarea{max-width:100%}
button{min-height:44px;white-space:normal}

.card{min-width:0}

@media(max-width:480px){

}

'use strict';
const KEY='billnexa-v1';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n||0);const round=n=>Math.round((n+Number.EPSILON)*100)/100;const num=v=>Math.max(0,Number(v)||0);const defaultData=()=>({version:1,business:{name:'',address:'',phone:'',email:'',gstin:'',state:'Gujarat',bank:'',upi:'',prefix:'INV'},customers:[],products:[],invoices:[],next:1});let db=defaultData();try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x.version===1)db=x}}catch(e){}let screen='home',draft=null,viewId=null,editing=null,filter='all',search='',toastTimer;const tabs=[['home','⌂','Home'],['invoices','▤','Bills'],['customers','♙','Customers'],['products','▦','Items'],['settings','⚙','More']];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save data. Please free storage and try again.');return false}}function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}function go(s){if(screen==='edit'&&s!=='edit'&&draft&&!confirm('Leave this unsaved bill?'))return;draft=null;editing=null;search='';filter='all';screen=s;render();window.scrollTo(0,0)}function render(){ $('nav').innerHTML=tabs.map(([s,i,l])=>`<button class="${screen===s||(s==='invoices'&&['edit','preview'].includes(screen))||(s==='products'&&['productstudio','inventory'].includes(screen))||(s==='customers'&&screen==='ledger')||(s==='settings'&&['reports','quotes','privacy','profile','backupsettings','datacontrols','terms','help','support','about','signature'].includes(screen))?'active':''}" onclick="go('${s}')">${uiIcon(s)}<span class="nav-label">${l}</span></button>`).join('');const f={home:home,invoices:invoices,customers:()=>directory('customers'),products:()=>directory('products'),settings:settings,edit:edit,preview:preview,productstudio:productStudio,privacy:privacyScreen,profile:profileScreen,backupsettings:backupSettings,datacontrols:dataControls,terms:termsScreen,help:helpScreen,support:supportScreen,about:aboutScreen,signature:signatureSettings,inventory:inventoryScreen,reports:reportsScreen,quotes:quotesScreen,ledger:ledgerScreen};$('main').innerHTML=f[screen]()+'<footer class="app-credit">Development by <a class="developer-link" href="https://www.instagram.com/ravivadhiya_07?cnvx=MXc4djRqZmxlb2R3OQ==" target="_blank" rel="noopener noreferrer" onclick="return openDeveloperProfile()" aria-label="Ravi Vadhiya on Instagram">Ravi Vadhiya</a></footer>'; }
function heading(t,p,extra=''){return `<div class="heading"><div><h1>${t}</h1><p>${p}</p></div>${extra}</div>`}function field(label,id,value='',type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}function area(label,id,value=''){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}">${esc(value)}</textarea></div>`}function get(id){return $(id).value.trim()}function select(label,id,opts,value,extra=''){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" ${extra}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
function totals(i){const lines=i.items.map(x=>{const gross=round(num(x.qty)*num(x.rate));const discount=round(gross*Math.min(100,num(x.discount))/100);const base=round(gross-discount);const tax=i.taxMode==='none'?0:round(base*num(x.gst)/100);return {gross,discount,base,tax,total:round(base+tax)}});const sum=k=>round(lines.reduce((a,x)=>a+x[k],0));const total=sum('total'),paid=Math.min(total,round(num(i.paid)));return {lines,base:sum('base'),discount:sum('discount'),tax:sum('tax'),total,paid,due:round(total-paid)}}function status(i){const t=totals(i);return t.due===0?'Paid':t.paid>0?'Partial':'Unpaid'}function tag(i){const s=i.kind==='quote'?'Quotation':status(i);return `<span class="tag ${s.toLowerCase()}">${s}</span>`}function invoiceRow(i){const t=totals(i);return `<div class="row"><div><h3>${esc(i.number)} · ${esc(i.customer.name)}</h3>${i.kind==='product'?'<div class="eyebrow" style="color:#245de5">Product bill</div>':''}<div class="muted">${esc(i.date)} · ${tag(i)}</div></div><div class="right"><strong>${money(t.total)}</strong><br><button class="ghost small" onclick="openInvoice('${esc(i.id)}')">View bill ›</button></div></div>`}
function home(){const sales=salesBills(),total=sales.reduce((a,i)=>a+totals(i).total,0),paid=sales.reduce((a,i)=>a+totals(i).paid,0),due=sales.reduce((a,i)=>a+totals(i).due,0);return `${heading('Business overview',esc(db.business.name||'Manage your business, simply.'))}<div class="card hero"><div class="eyebrow" style="color:#d7e5ff">YOUR BILLING WORKSPACE</div><h1>Make every sale count.</h1><p>Create professional invoices, track payments and manage customers.</p><button onclick="newInvoice()">＋ Create invoice</button></div><div class="grid stats">${[['Total sales',money(total)],['Received',money(paid)],['Outstanding',money(due)],['Total bills',sales.length]].map(([a,b])=>`<div class="card"><div class="eyebrow">${a}</div><div class="stat">${b}</div></div>`).join('')}</div><div class="spacer"></div><div class="card"><h2>Quick actions</h2><div class="grid"><button class="primary" onclick="go('productstudio')">▦ Product Bill Studio</button><button onclick="newInvoice()">＋ New invoice</button><button onclick="go('customers')">Customers</button><button onclick="go('products')">Products & services</button><button onclick="go('settings')">Business profile</button><button onclick="go('inventory')">Inventory & stock</button><button onclick="go('reports')">Sales reports</button><button onclick="go('quotes')">Quotations</button><button onclick="go('ledger')">Customer ledger</button></div></div><div class="card"><div class="actions space"><h2>Recent invoices</h2><button class="ghost" onclick="go('invoices')">View all ›</button></div>${sales.length?sales.slice().reverse().slice(0,5).map(invoiceRow).join(''):'<div class="empty">No invoices yet. Create your first bill.</div>'}</div>`}
function invoices(){return `${heading('Invoices','Find, share and manage your bills.','<button class="primary" onclick="newInvoice()">＋ New</button>')}<input class="search" id="query" placeholder="Search invoice or customer" value="${esc(search)}" oninput="search=this.value;invoiceList()"><div class="actions" style="margin-bottom:14px">${['all','Paid','Partial','Unpaid'].map(v=>`<button class="${filter===v?'primary':''} small" onclick="filter='${v}';render()">${v==='all'?'All':v}</button>`).join('')}</div><div class="card" id="invoiceList">${invoiceListHtml()}</div>`}function invoiceListHtml(){const rows=salesBills().slice().reverse().filter(i=>(filter==='all'||status(i)===filter)&&`${i.number} ${i.customer.name}`.toLowerCase().includes(search.toLowerCase()));return rows.length?rows.map(invoiceRow).join(''):'<div class="empty">No matching bills.</div>'}function invoiceList(){$('invoiceList').innerHTML=invoiceListHtml()}
function directory(type){const isC=type==='customers';const title=isC?'Customers':'Products & services';const list=db[type];const e=editing&&editing.type===type?list.find(x=>x.id===editing.id):null;return `${heading(title,isC?'Save customer contact and billing details.':'Build your reusable item catalog.',isC?'<button class="primary" onclick="go(\'ledger\')">Customer ledger</button>':'<button class="primary" onclick="go(\'productstudio\')">Product Bill</button>')}<div class="card"><h2>${e?'Edit':'Add'} ${isC?'customer':'item'}</h2>${field('Name *','dname',e?.name)}<div class="grid">${isC?field('Phone','dphone',e?.phone,'tel')+field('GSTIN (optional)','dgstin',e?.gstin):field('Unit price (₹)','drate',e?.rate??0,'number','min="0" step="0.01"')+field('GST %','dgst',e?.gst??0,'number','min="0" max="100" step="0.01"')}</div>${isC?area('Billing address','daddress',e?.address):field('HSN / SAC','dhsn',e?.hsn)+field('Unit','dunit',e?.unit||'pcs')+`<div class="grid">${field('SKU / barcode','dsku',e?.sku||'')}${field('Category','dcategory',e?.category||'')}${field('Default discount %','ddiscount',e?.discount??0,'number','min="0" max="100" step="0.01"')}</div>`}<div class="actions"><button class="primary" onclick="saveDirectory('${type}')">${e?'Update':'Save'}</button>${e?'<button onclick="editing=null;render()">Cancel</button>':''}</div></div><div class="card"><h2>Saved ${isC?'customers':'items'} · ${list.length}</h2>${list.length?list.map(x=>`<div class="row"><div><h3>${esc(x.name)}</h3><div class="muted">${isC?esc(x.phone||x.gstin||'No phone'):money(x.rate)+' · GST '+esc(x.gst)+'%'+(x.sku?' · SKU '+esc(x.sku):'')+(x.category?' · '+esc(x.category):'')}</div></div><div class="actions"><button class="small" onclick="editDirectory('${type}','${esc(x.id)}')">Edit</button><button class="small danger" onclick="deleteDirectory('${type}','${esc(x.id)}')">Delete</button></div></div>`).join(''):'<div class="empty">Nothing saved yet.</div>'}</div>`}
function saveDirectory(type){const name=get('dname');if(!name)return toast('Enter a name');let obj={id:editing?.id||uid(),name};if(type==='customers'){Object.assign(obj,{phone:get('dphone'),gstin:get('dgstin').toUpperCase(),address:get('daddress')})}else{Object.assign(obj,{rate:num(get('drate')),gst:Math.min(100,num(get('dgst'))),hsn:get('dhsn'),unit:get('dunit')||'pcs',sku:get('dsku'),category:get('dcategory'),discount:Math.min(100,num(get('ddiscount')))})}const idx=db[type].findIndex(x=>x.id===obj.id);if(type==='products'&&idx>=0){const prev=db.products[idx];for(const k of ['stock','lowStock','cost'])if(Number.isFinite(prev[k]))obj[k]=prev[k]}if(idx<0)db[type].push(obj);else db[type][idx]=obj;persist();editing=null;render();toast('Saved')}function editDirectory(type,id){editing={type,id};render();window.scrollTo(0,0)}function deleteDirectory(type,id){if(type==='products'&&db.invoices.some(i=>(i.stockMoves||[]).some(m=>m.id===id)))return toast('This item has stock-linked invoices. Keep it for stock history.');if(!confirm('Delete this saved entry? Existing bills are unchanged.'))return;db[type]=db[type].filter(x=>x.id!==id);editing=null;persist();render()}
function blankItem(){return {name:'',hsn:'',unit:'pcs',qty:1,rate:0,gst:0,discount:0}}function newInvoice(kind='standard',productId=''){if(screen==='edit'&&draft&&!confirm('Discard current unsaved bill?'))return;draft={id:uid(),number:`${kind==='quote'?'QT':db.business.prefix||'INV'}-${String(db.next).padStart(4,'0')}`,date:today(),dueDate:'',taxMode:'none',customer:{name:'',phone:'',gstin:'',address:''},business:JSON.parse(JSON.stringify(db.business)),items:[blankItem()],paid:0,payment:'Cash',notes:'Thank you for your business!',isNew:true,kind};if(kind==='product'){draft.customer.name='Walk-in customer';const p=db.products.find(x=>x.id===productId);if(p)draft.items=[{...blankItem(),...p,productId:p.id,qty:1}]}screen='edit';render();window.scrollTo(0,0)}
function edit(){const d=draft;return `${heading(d.kind==='quote'?(d.isNew?'Create quotation':'Edit quotation'):d.kind==='product'?(d.isNew?'Product bill':'Edit product bill'):(d.isNew?'Create invoice':'Edit invoice'),d.kind==='product'?'Retail & wholesale product billing · prices exclude GST':'Add details and calculate your total automatically.')}<div class="editlayout"><div><div class="card shop-editor"><div class="actions space"><h2>Shop / Business details</h2><button class="small" onclick="useBusinessProfile()">Use saved profile</button></div>${field('Shop / Business name *','billShopName',d.business.name||'','text','maxlength="150"')}${area('Shop address','billShopAddress',d.business.address)}<div class="grid">${field('Phone','billShopPhone',d.business.phone,'tel')+field('GSTIN','billShopGstin',d.business.gstin)+field('State','billShopState',d.business.state)}</div>${shopLogoField('billLogo',d.business.logo)}<label class="shop-check"><input id="rememberShop" type="checkbox" ${d.rememberShop?'checked':''}> Save these shop details for future bills</label></div><div class="card"><h2>Invoice details</h2><div class="grid">${field('Invoice number *','number',d.number)+field('Invoice date *','date',d.date,'date')+field(d.kind==='quote'?'Valid until':'Due date','dueDate',d.dueDate,'date')+select('Tax type','taxMode',[['none','Non-GST'],['local','GST · CGST + SGST'],['inter','GST · IGST']],d.taxMode,'onchange="capture();renderItems()"')}</div></div><div class="card"><h2>Bill to</h2>${select('Choose saved customer','customerPick',[['','Select customer'],...db.customers.map(x=>[x.id,x.name])],'','onchange="pickCustomer(this.value)"')}${field('Customer name *','cname',d.customer.name)}<div class="grid">${field('Phone','cphone',d.customer.phone,'tel')+field('GSTIN','cgstin',d.customer.gstin)}</div>${area('Address','caddress',d.customer.address)}</div><div class="card"><div class="actions space"><h2>Items</h2><button class="small" onclick="addItem()">＋ Item</button></div>${select('Add from catalog','productPick',[['','Select saved product'],...db.products.map(x=>[x.id,x.name])],'','onchange="pickProduct(this.value)"')}${productPicker()}<div id="items">${itemsHtml()}</div></div></div><div><div class="card summary"><h2>Bill summary</h2><div id="sum">${sumHtml()}</div><div class="spacer"></div>${d.kind==='quote'?'<input type="hidden" id="paid" value="0"><input type="hidden" id="payment" value="Other">':field('Amount received (₹)','paid',d.paid,'number','min="0" step="0.01" oninput="capture();refreshSum()"')+select('Payment method','payment',[['Cash','Cash'],['UPI','UPI'],['Card','Card'],['Bank transfer','Bank transfer'],['Other','Other']],d.payment)}${d.kind==='product'?'<div class="actions" style="margin-bottom:12px"><button onclick="setProductPaid(true)">Full payment</button><button onclick="setProductPaid(false)">Unpaid</button></div>':''}${area('Notes / terms','notes',d.notes)}<button class="primary full" onclick="saveInvoice()">Save & preview ${d.kind==='quote'?'quotation':'invoice'}</button><div class="notice">GST is calculated on discounted, tax-exclusive item prices. Select the correct tax type for your supply.</div></div></div></div>`}
function itemsHtml(){return draft.items.map((x,i)=>`<div class="item"><div class="actions space"><h3>Item ${i+1}</h3><button class="ghost small" onclick="removeItem(${i})">Remove</button></div>${field('Description *',`name${i}`,x.name,'text','oninput="updateItems()"')}${draft.kind==='product'?field('SKU / barcode',`sku${i}`,x.sku||'')+'<div class="actions" style="margin-bottom:10px"><button class="small" onclick="changeProductQty('+i+',-1)">−</button><button class="small" onclick="changeProductQty('+i+',1)">＋</button></div>':''}<div class="grid">${field('Qty',`qty${i}`,x.qty,'number','min="0.001" step="0.001" oninput="updateItems()"')+field('Rate ₹',`rate${i}`,x.rate,'number','min="0" step="0.01" oninput="updateItems()"')+field('Discount %',`discount${i}`,x.discount,'number','min="0" max="100" oninput="updateItems()"')+(draft.taxMode==='none'?'':field('GST %',`gst${i}`,x.gst,'number','min="0" max="100" step="0.01" oninput="updateItems()"'))+field('HSN / SAC',`hsn${i}`,x.hsn)+field('Unit',`unit${i}`,x.unit)}</div></div>`).join('')}
function capture(){if(!$('number'))return;if($('billShopName')){Object.assign(draft.business,{name:get('billShopName'),address:get('billShopAddress'),phone:get('billShopPhone'),gstin:get('billShopGstin').toUpperCase(),state:get('billShopState')});const logo=get('billLogo');if(validShopLogo(logo))draft.business.logo=logo;else delete draft.business.logo;draft.rememberShop=$('rememberShop').checked;}Object.assign(draft,{number:get('number'),date:get('date'),dueDate:get('dueDate'),taxMode:get('taxMode'),paid:num(get('paid')),payment:get('payment'),notes:get('notes'),customer:{name:get('cname'),phone:get('cphone'),gstin:get('cgstin').toUpperCase(),address:get('caddress')}});draft.items.forEach((x,i)=>{for(const k of ['name','hsn','unit','sku'])if($(k+i))x[k]=get(k+i);for(const k of ['qty','rate','discount','gst'])if($(k+i))x[k]=['discount','gst'].includes(k)?Math.min(100,num(get(k+i))):num(get(k+i))})}
function updateItems(){capture();refreshSum()}function sumHtml(){const t=totals(draft);return `<div class="row"><span>Taxable / net amount</span><strong>${money(t.base)}</strong></div><div class="row"><span>Discount</span><strong>${money(t.discount)}</strong></div>${draft.taxMode==='local'?`<div class="row"><span>CGST</span><strong>${money(round(t.tax/2))}</strong></div><div class="row"><span>SGST</span><strong>${money(round(t.tax-round(t.tax/2)))}</strong></div>`:draft.taxMode==='inter'?`<div class="row"><span>IGST</span><strong>${money(t.tax)}</strong></div>`:''}${draft.kind==='product'?productTaxSummary(draft):''}<div class="row total"><span>Total</span><span>${money(t.total)}</span></div>${draft.kind==='quote'?'':`<div class="row"><span>Balance due</span><strong>${money(t.due)}</strong></div>`}`}function refreshSum(){$('sum').innerHTML=sumHtml()}function renderItems(){$('items').innerHTML=itemsHtml();refreshSum()}function addItem(){capture();draft.items.push(blankItem());renderItems()}function removeItem(i){capture();draft.items.splice(i,1);if(!draft.items.length)draft.items.push(blankItem());renderItems()}function pickCustomer(id){capture();const c=db.customers.find(x=>x.id===id);if(c){draft.customer={...c};render()}}function pickProduct(id){capture();const p=db.products.find(x=>x.id===id);if(p){const x={...blankItem(),...p,productId:p.id,qty:1};if(draft.items.length===1&&!draft.items[0].name)draft.items[0]=x;else draft.items.push(x);if($('productPick'))$('productPick').value='';renderItems();toast('Product added to bill')}}
function saveInvoice(){capture();const d=draft;if(!d.business.name.trim())return toast('Enter your shop or business name first.');if(!d.number||!d.date||!d.customer.name||d.items.some(x=>!x.name||x.qty<=0))return toast('Enter invoice number, date, customer and valid items.');if(d.dueDate&&d.dueDate<d.date)return toast('Due date cannot be before invoice date.');if(db.invoices.some(x=>x.id!==d.id&&x.number.toLowerCase()===d.number.toLowerCase()))return toast('Invoice number already exists.');if(d.taxMode!=='none'&&(!d.business.name||!d.business.gstin))return toast('Set business name and GSTIN in More before creating a GST bill.');if(d.paid>totals(d).total)return toast('Received amount cannot exceed bill total.');const i=JSON.parse(JSON.stringify(d));delete i.isNew;delete i.rememberShop;if(i.kind==='quote')i.paid=0;const ix=db.invoices.findIndex(x=>x.id===i.id);const old=ix<0?null:db.invoices[ix];const prev=JSON.stringify(db);try{applyStockChange(old,i)}catch(e){return toast(e.message)}if(ix===-1){db.invoices.push(i);db.next++}else db.invoices[ix]=i;if(d.rememberShop){const {name,address,phone,gstin,state,logo}=i.business;Object.assign(db.business,{name,address,phone,gstin,state});if(validShopLogo(logo))db.business.logo=logo;else delete db.business.logo;}if(!persist()){db=JSON.parse(prev);return}draft=null;openInvoice(i.id);toast(i.kind==='quote'?'Quotation saved':'Invoice saved')}
function openInvoice(id){viewId=id;screen='preview';draft=null;render();window.scrollTo(0,0)}function paper(i){const t=totals(i),b=i.business,c=i.customer;return `<article class="invoice-paper"><div class="billhead"><div class="grid"><div>${shopLogoHtml(b.logo)}<h1>${esc(b.name||'Shop name not set')}</h1><p>${esc(b.address)}${b.phone?'\nPhone: '+esc(b.phone):''}${b.email?'\n'+esc(b.email):''}${b.gstin?'\nGSTIN: '+esc(b.gstin):''}${b.state?'\n'+esc(b.state):''}</p></div><div class="right">${billDocumentTitle(i)?'<h2>'+billDocumentTitle(i)+'</h2>':''}<p>No. ${esc(i.number)}\nDate: ${esc(i.date)}${i.dueDate?'\n'+(i.kind==='quote'?'Valid until: ':'Due: ')+esc(i.dueDate):''}</p></div></div></div><div class="grid"><div><div class="eyebrow">Bill to</div><h3>${esc(c.name)}</h3><p>${esc(c.address)}${c.phone?'\nPhone: '+esc(c.phone):''}${c.gstin?'\nGSTIN: '+esc(c.gstin):''}</p></div><div class="right"><div class="eyebrow">${i.kind==='quote'?'Document':'Payment status'}</div>${tag(i)}<p>${i.kind==='quote'?'Not a tax invoice':esc(i.payment)}</p></div></div><div class="invoice-table"><table><thead><tr><th>Item / HSN</th><th>Qty</th><th>Rate</th><th>Disc.</th>${i.taxMode!=='none'?'<th>GST</th>':''}<th>Amount</th></tr></thead><tbody>${i.items.map((x,j)=>`<tr><td><strong>${esc(x.name)}</strong>${x.hsn?'<br>HSN: '+esc(x.hsn):''}${i.kind==='product'&&x.sku?'<br>SKU: '+esc(x.sku):''}</td><td>${esc(x.qty)} ${esc(x.unit)}</td><td>${money(x.rate)}</td><td>${esc(x.discount)}%</td>${i.taxMode!=='none'?`<td>${esc(x.gst)}%</td>`:''}<td>${money(t.lines[j].total)}</td></tr>`).join('')}</tbody></table></div>${i.kind==='product'?productTaxSummary(i):''}<div class="line"><span>Discount</span><strong>${money(t.discount)}</strong></div><div class="line"><span>Net amount</span><strong>${money(t.base)}</strong></div>${i.taxMode==='local'?`<div class="line"><span>CGST</span><strong>${money(round(t.tax/2))}</strong></div><div class="line"><span>SGST</span><strong>${money(round(t.tax-round(t.tax/2)))}</strong></div>`:i.taxMode==='inter'?`<div class="line"><span>IGST</span><strong>${money(t.tax)}</strong></div>`:''}<div class="line total" style="border-top:1px solid #bbc9da;margin-top:9px;padding-top:12px"><span>Grand total</span><span>${money(t.total)}</span></div>${i.kind==='quote'?'':`<div class="line"><span>Received</span><strong>${money(t.paid)}</strong></div><div class="line"><span>Balance due</span><strong>${money(t.due)}</strong></div>`}${b.bank||b.upi?`<div class="spacer"></div><h3>Payment details</h3><p>${esc(b.bank)}${b.upi?'\nUPI: '+esc(b.upi):''}</p>`:''}${i.notes?`<div class="spacer"></div><h3>Notes / terms</h3><p>${esc(i.notes)}</p>`:''}<div class="invoice-footer"><div><p>Thank you for your business.</p><div class="inv-label">BILLNEXA</div></div><div class="right signature-block">${signatureSvg(i.signature)}<p>Authorised signatory<br>${esc(b.name||'')}</p></div></div></article>`}function preview(){const i=db.invoices.find(x=>x.id===viewId);if(!i)return heading('Invoice not found','');return `${heading(i.kind==='quote'?'Quotation preview':'Invoice preview',esc(i.number))}<div class="invoice-export"><h2>Export invoice</h2><p>Print-ready PDF · HD JPG (300 DPI equivalent)</p><div class="export-grid"><button class="primary" onclick="exportBillPdf('save')">↓ Download PDF</button><button onclick="exportBillPdf('share')">Share PDF</button><button onclick="exportBillJpg('save')">↓ Save JPG</button><button onclick="exportBillJpg('share')">Share JPG</button><button onclick="exportBillPdf('print')">Print A4</button></div><div class="actions"><button class="small primary" onclick="openSignature('bill')">${validSignature(i.signature)?'Edit signature':'＋ Add signature'}</button><button class="small" onclick="editInvoice()">Edit bill / Shop details</button>${i.kind==='quote'?'<button class="small primary" onclick="duplicateBill(true)">Convert to invoice</button>':'<button class="small" onclick="recordPayment()">Record payment</button>'}<button class="small" onclick="duplicateBill(false)">Duplicate</button>${i.kind==='quote'?'':'<button class="small" onclick="shareInvoice()">Share summary</button>'}<button class="small danger" onclick="deleteInvoice()">Delete</button></div></div>${!i.business.name.trim()?'<div class="notice"><strong>Shop name not set.</strong> Tap Edit bill / Shop details to enter your actual business name before exporting.</div>':''}${paper(i)}`}function printInvoice(){const i=db.invoices.find(x=>x.id===viewId);$('printArea').innerHTML=paper(i);if(window.BillNexaNative)window.BillNexaNative.printInvoice(i.number,'<!doctype html><html><head><meta charset="utf-8"><style>'+document.querySelector("style").textContent+' @media print{body>#printArea{display:block!important}} </style></head><body><div id="printArea">'+paper(i)+'</div></body></html>');else window.print()}function shareInvoice(){const i=db.invoices.find(x=>x.id===viewId),t=totals(i);if(!i.business.name.trim())return toast('Add your shop name before sharing.');if(i.kind==='quote')return toast('Use Share PDF or Share JPG for quotations.');const text=`${i.business.name||'Invoice'}\nInvoice: ${i.number}\nDate: ${i.date}\nCustomer: ${i.customer.name}\n${i.items.map(x=>`${x.name} × ${x.qty}`).join('\n')}\nTotal: ${money(t.total)}\nReceived: ${money(t.paid)}\nBalance: ${money(t.due)}${i.business.upi?'\nUPI: '+i.business.upi:''}`;if(window.BillNexaNative)window.BillNexaNative.shareText(text);else if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Summary copied')).catch(()=>prompt('Copy invoice summary',text));else prompt('Copy invoice summary',text)}function editInvoice(){const signed=db.invoices.find(x=>x.id===viewId);if(validSignature(signed?.signature)&&!confirm('Editing and saving this bill will remove its signature. You can sign it again after saving. Continue?'))return;draft=JSON.parse(JSON.stringify(db.invoices.find(x=>x.id===viewId)));draft.isNew=false;delete draft.signature;screen='edit';render();window.scrollTo(0,0)}function recordPayment(){const i=db.invoices.find(x=>x.id===viewId),t=totals(i);if(i.kind==='quote')return toast('Convert quotation to invoice first');if(!t.due)return toast('Invoice already paid');const v=prompt(`Enter additional payment (balance ${money(t.due)})`,String(t.due));if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<=0||n>t.due)return toast('Enter a valid payment within the balance.');if(validSignature(i.signature)&&!confirm('Recording payment changes this signed bill. Its signature will be removed. Continue?'))return;const before=JSON.parse(JSON.stringify(i));i.paid=round(t.paid+n);delete i.signature;if(!persist()){Object.assign(i,before);return}render();toast('Payment recorded')}function deleteInvoice(){if(!confirm('Permanently delete this invoice?'))return;const i=db.invoices.find(x=>x.id===viewId),prev=JSON.stringify(db);try{applyStockChange(i,null)}catch(e){return toast(e.message)}db.invoices=db.invoices.filter(x=>x.id!==viewId);if(!persist()){db=JSON.parse(prev);return}go(i.kind==='quote'?'quotes':'invoices')}

function validBackup(x){const id=v=>typeof v==='string'&&/^[a-zA-Z0-9-]+$/.test(v);const str=v=>typeof v==='string';const number=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0;const fields=(o,keys)=>o&&keys.every(k=>str(o[k]));const biz=o=>fields(o,['name','address','phone','email','gstin','state','bank','upi','prefix'])&&(o.logo===undefined||validShopLogo(o.logo));const customer=o=>fields(o,['name','phone','gstin','address']);const item=o=>fields(o,['name','hsn','unit'])&&number(o.rate)&&number(o.gst)&&number(o.qty)&&o.qty>0&&number(o.discount);return x&&x.version===1&&(x.defaultSignature===undefined||validSignature(x.defaultSignature))&&biz(x.business)&&Number.isSafeInteger(x.next)&&x.next>0&&Array.isArray(x.customers)&&x.customers.every(o=>customer(o)&&id(o.id))&&Array.isArray(x.products)&&x.products.every(o=>id(o.id)&&fields(o,['name','hsn','unit'])&&number(o.rate)&&number(o.gst)&&['stock','lowStock','cost'].every(k=>o[k]===undefined||number(o[k])))&&Array.isArray(x.invoices)&&x.invoices.every(o=>id(o.id)&&fields(o,['number','date','dueDate','payment','notes'])&&['none','local','inter'].includes(o.taxMode)&&biz(o.business)&&(o.signature===undefined||validSignature(o.signature))&&customer(o.customer)&&number(o.paid)&&Array.isArray(o.items)&&o.items.length&&o.items.every(item)&&(o.stockMoves===undefined||(Array.isArray(o.stockMoves)&&o.stockMoves.every(m=>m&&id(m.id)&&number(m.qty)&&m.qty>0))))} $('restoreFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20000000)throw Error('Large file');const x=JSON.parse(await f.text());if(!validBackup(x))throw Error('Invalid format');if(!confirm('Replace all current billing data with this backup?'))return;const prev=db;db=x;if(!persist()){db=prev;return}go('home');toast('Backup restored')}catch(err){toast('Invalid BillNexa backup file')}});

function salesBills(){return db.invoices.filter(i=>i.kind!=='quote')}
const stockRound=n=>Math.round(n*1000)/1000;
function applyStockChange(old,next){
 const delta=new Map(),moves=new Map(),add=(id,n)=>delta.set(id,stockRound((delta.get(id)||0)+n));
 if(old)for(const m of old.stockMoves||[])add(m.id,m.qty);
 if(next&&next.kind!=='quote')for(const x of next.items){
   const id=x.productId;
   const p=db.products.find(p=>p.id===id);
   if(p&&Number.isFinite(p.stock)){moves.set(id,stockRound((moves.get(id)||0)+num(x.qty)));add(id,-num(x.qty))}
 }
 const updates=[];
 for(const [id,n] of delta){
   const p=db.products.find(p=>p.id===id);
   if(!p||!Number.isFinite(p.stock))throw Error('Stock record missing. Check inventory.');
   const v=stockRound(p.stock+n);if(v<0)throw Error('Insufficient stock: '+p.name+' ('+p.stock+' '+p.unit+' available)');
   updates.push([p,v]);
 }
 for(const [p,v] of updates)p.stock=v;
 if(next)next.stockMoves=Array.from(moves,([id,qty])=>({id,qty})).filter(m=>m.qty>0);
}

function saveStock(){

 const vals=['invstock','invlow','invcost'].map(k=>get(k));if(vals.some(v=>v===''||!Number.isFinite(Number(v))||Number(v)<0))return toast('Enter valid nonnegative stock and cost values');
 const old=db.products[idx];db.products[idx]={...old,stock:stockRound(Number(vals[0])),lowStock:stockRound(Number(vals[1])),cost:round(Number(vals[2]))};
 if(!persist()){db.products[idx]=old;return}render();toast('Stock updated');
}
let reportPeriod='month';
function reportBills(period,now=today()){
 const d=new Date(now+'T12:00:00');d.setDate(d.getDate()-6);const week=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 return salesBills().filter(i=>period==='all'||(i.date<=now&&(period==='today'?i.date===now:period==='week'?i.date>=week:i.date.slice(0,7)===now.slice(0,7))));
}
function reportData(rows){
 const sum={sales:0,received:0,due:0,tax:0,discount:0,count:rows.length},byDay=new Map(),byProduct=new Map();
 for(const i of rows){const t=totals(i);sum.sales+=t.total;sum.received+=t.paid;sum.due+=t.due;sum.tax+=t.tax;sum.discount+=t.discount;byDay.set(i.date,(byDay.get(i.date)||0)+t.total);i.items.forEach((x,j)=>{const k=x.name+' / '+x.unit,v=byProduct.get(k)||{qty:0,sales:0};v.qty+=num(x.qty);v.sales+=t.lines[j].base;byProduct.set(k,v)})}
 return {sum,days:[...byDay].sort((a,b)=>a[0].localeCompare(b[0])),products:[...byProduct].sort((a,b)=>b[1].sales-a[1].sales)};
}
function reportsScreen(){
 const {sum,days,products}=reportData(reportBills(reportPeriod)),max=days.reduce((m,x)=>Math.max(m,x[1]),1);
 return heading('Sales reports','Invoice totals by billing date, excluding quotations.')+
 '<div class="actions" style="margin-bottom:14px">'+[['today','Today'],['week','7 days'],['month','This month'],['all','All time']].map(([v,l])=>'<button class="small '+(reportPeriod===v?'primary':'')+'" onclick="reportPeriod=\''+v+'\';render()">'+l+'</button>').join('')+'</div>'+
 statCards([['Sales',money(sum.sales)],['Received',money(sum.received)],['Outstanding',money(sum.due)],['GST total',money(sum.tax)],['Discounts',money(sum.discount)],['Bills',sum.count]])+
 '<div class="card"><h2>Daily sales</h2>'+ (days.length?days.slice(-31).map(([d,v])=>'<div style="margin:12px 0"><div class="actions space"><span>'+esc(d)+'</span><strong>'+money(v)+'</strong></div><div class="report-track"><div style="width:'+Math.min(100,v/max*100)+'%"></div></div></div>').join(''):'<p>No sales in this period.</p>')+'</div><div class="card"><h2>Top products · net of GST</h2>'+products.slice(0,20).map(([k,v])=>'<div class="row"><div><h3>'+esc(k)+'</h3><span class="muted">Qty '+esc(stockRound(v.qty))+'</span></div><strong>'+money(v.sales)+'</strong></div>').join('')+'</div><div class="notice">Received amounts are cumulative payments on bills dated in this period, not cash-flow dates. GST totals use entered rates.</div>';
}
function quotesScreen(){
 const rows=db.invoices.filter(i=>i.kind==='quote').slice().reverse();
 return heading('Quotations','Create estimates and convert them into invoices.','<button class="primary" onclick="newInvoice(\'quote\')">＋ New quote</button>')+'<div class="card">'+(rows.length?rows.map(invoiceRow).join(''):'<div class="empty">No quotations yet.</div>')+'</div>';
}
function duplicateBill(convert){
 const i=db.invoices.find(x=>x.id===viewId);if(!i)return;
 draft=JSON.parse(JSON.stringify(i));draft.kind=convert?'standard':i.kind;draft.id=uid();draft.number=(draft.kind==='quote'?'QT':db.business.prefix||'INV')+'-'+String(db.next).padStart(4,'0');draft.date=today();draft.dueDate='';draft.paid=0;draft.isNew=true;delete draft.stockMoves;delete draft.signature;screen='edit';render();window.scrollTo(0,0);
}

 home:'<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1z"/>',

 products:'<path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5m-9 5v9M7 5.5l9 5"/>',
 settings:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 sales:'<path d="M3 18h18M5 15l5-5 4 3 6-8m-5 0h5v5"/>',

function uiIcon(key){return '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(UI_PATHS[key]||UI_PATHS.invoices)+'</svg>'}
let ledgerQuery='',ledgerSort='recent',ledgerFilter='all';
function ledgerGroups(){
 const map=new Map();
 for(const i of salesBills()){
  const c=i.customer,k=JSON.stringify([c.name,c.phone,c.gstin].map(v=>String(v||'').trim().toLowerCase()));
  let g=map.get(k);
  if(!g){g={name:c.name,phone:c.phone,address:c.address,gstin:c.gstin,count:0,sales:0,paid:0,due:0,last:'',bills:[]};map.set(k,g)}
  const t=totals(i);g.count++;g.sales=round(g.sales+t.total);g.paid=round(g.paid+t.paid);g.due=round(g.due+t.due);g.bills.push(i);if(i.date>=g.last){g.last=i.date;g.address=c.address}
 }
 for(const c of db.customers){const k=JSON.stringify([c.name,c.phone,c.gstin].map(v=>String(v||'').trim().toLowerCase()));if(!map.has(k))map.set(k,{name:c.name,phone:c.phone,address:c.address,gstin:c.gstin,count:0,sales:0,paid:0,due:0,last:'',bills:[]})}
 return [...map.values()];
}
function ledgerResults(groups=ledgerGroups()){
 const q=ledgerQuery.trim().toLowerCase();
 const rows=groups.filter(g=>(ledgerFilter!=='due'||g.due>0)&&[g.name,g.phone,g.gstin,g.address].some(v=>String(v||'').toLowerCase().includes(q)));
 rows.sort((a,b)=>ledgerSort==='due'?b.due-a.due:ledgerSort==='name'?a.name.localeCompare(b.name):b.last.localeCompare(a.last));
 return '<div class="actions space ledger-count"><h2>Customers ('+rows.length+')</h2></div>'+(rows.length?rows.map(g=>'<div class="ledger-entry"><div class="ledger-avatar">'+esc((g.name||'?').trim().slice(0,1).toUpperCase())+'</div><div class="ledger-person"><h3>'+esc(g.name)+'</h3><p>'+esc(g.phone||'No phone')+'</p>'+(g.address?'<p>'+esc(g.address)+'</p>':'')+'<span class="muted">'+g.count+' bills</span></div><div class="ledger-money"><div><span>Total sales</span><strong>'+money(g.sales)+'</strong></div><div><span>Received</span><strong>'+money(g.paid)+'</strong></div><div><span>Outstanding</span><strong class="'+(g.due>0?'due-text':'paid-text')+'">'+money(g.due)+'</strong></div></div></div>').join(''):'<div class="empty">No matching customers.</div>');
}
function refreshLedger(){$('ledgerResults').innerHTML=ledgerResults()}
function ledgerScreen(){
 const groups=ledgerGroups(),sum=groups.reduce((a,g)=>({sales:a.sales+g.sales,paid:a.paid+g.paid,due:a.due+g.due}),{sales:0,paid:0,due:0});
 const recent=salesBills().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 return '<div class="ledger-head"><button class="back-button" aria-label="Back" onclick="go(\'customers\')">'+uiIcon('back')+'</button><div><h1>Customer Ledger</h1><p>Sales, payments & outstanding</p></div><button class="primary" onclick="go(\'customers\')">'+uiIcon('plus')+' Customer</button></div><div class="ledger-shell"><div class="ledger-search"><span>'+uiIcon('search')+'</span><input aria-label="Search customers" placeholder="Search name, phone, GST…" value="'+esc(ledgerQuery)+'" oninput="ledgerQuery=this.value;refreshLedger()"></div><div class="ledger-metrics">'+[['sales','Total Sales',sum.sales],['wallet','Received',sum.paid],['due','Outstanding',sum.due]].map(([k,l,v])=>'<div class="ledger-metric '+k+'">'+uiIcon(k)+'<span>'+l+'</span><strong>'+money(v)+'</strong></div>').join('')+'</div><div class="ledger-filters">'+select('Show','ledgerFilter',[['all','All customers'],['due','Outstanding only']],ledgerFilter,'onchange="ledgerFilter=this.value;refreshLedger()"')+select('Sort','ledgerSort',[['recent','Recent'],['due','Highest due'],['name','Name A–Z']],ledgerSort,'onchange="ledgerSort=this.value;refreshLedger()"')+'</div><div id="ledgerResults">'+ledgerResults(groups)+'</div><div class="card recent-card"><div class="actions space"><h2>Recent Transactions</h2><button class="ghost small" onclick="go(\'invoices\')">View all '+uiIcon('arrow')+'</button></div>'+(recent.length?recent.map(invoiceRow).join(''):'<div class="empty">No transactions yet.</div>')+'</div></div>';
}


function validSignature(v){
 if(!Array.isArray(v)||!v.length||v.length>80)return false;
 let n=0;
 for(const stroke of v){if(!Array.isArray(stroke)||!stroke.length)return false;n+=stroke.length;if(n>1600)return false;
  for(const p of stroke)if(!Array.isArray(p)||p.length!==2||!Number.isFinite(p[0])||!Number.isFinite(p[1])||p[0]<0||p[0]>600||p[1]<0||p[1]>200)return false;
 }
 return n>=2&&v.some(stroke=>stroke.length>=2&&stroke.some(p=>p[0]!==stroke[0][0]||p[1]!==stroke[0][1]));
}
function signatureSvg(v){
 if(!validSignature(v))return '';
 return '<svg class="signature-art" viewBox="0 0 600 200" role="img" aria-label="Handwritten signature" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#152d55" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">'+v.map(stroke=>stroke.length===1?'<circle cx="'+stroke[0][0]+'" cy="'+stroke[0][1]+'" r="2.25" fill="#152d55" stroke="none"/>':'<polyline points="'+stroke.map(p=>p.join(',')).join(' ')+'"/>').join('')+'</g></svg>';
}
function signatureSettings(){
 return settingsHeading('Saved signature','Draw a reusable handwritten signature for your bills.')+'<div class="card"><h2>Authorised signatory</h2><div class="signature-sample">'+(signatureSvg(db.defaultSignature)||'<p>No saved signature yet.</p>')+'</div><p>Saved locally on this device. Apply it to individual bills only when you choose.</p><button class="primary full" onclick="openSignature(\'default\')">'+(validSignature(db.defaultSignature)?'Edit saved signature':'Create signature')+'</button></div><div class="notice">This is a handwritten electronic signature appearance, not a certificate-based DSC or cryptographic PDF signature.</div>';
}
let sigDraft=[],sigTarget='',sigBillId=null,sigPointer=null;
function closeSignature(){const el=$('signatureDialog');if(el)el.remove();sigPointer=null;sigTarget='';sigBillId=null;sigDraft=[]}
function openSignature(target){
 closeSignature();sigTarget=target;sigBillId=target==='bill'?viewId:null;
 const i=db.invoices.find(x=>x.id===sigBillId);if(target==='bill'&&!i)return closeSignature();
 const initial=target==='bill'?i.signature:db.defaultSignature;
 sigDraft=validSignature(initial)?JSON.parse(JSON.stringify(initial)):[];
 const el=document.createElement('dialog');el.id='signatureDialog';el.className='signature-dialog';
 el.innerHTML='<div class="signature-header"><h2>Handwritten signature</h2><button class="ghost" aria-label="Close" onclick="closeSignature()">✕</button></div><p>Sign with your finger or stylus in the box.</p><canvas id="signaturePad" width="1200" height="400" aria-label="Draw signature"></canvas><div class="actions signature-tools"><button onclick="clearSignature()">Clear</button><button onclick="undoSignature()">Undo</button>'+(target==='bill'&&validSignature(db.defaultSignature)?'<button onclick="useSavedSignature()">Use saved signature</button>':'')+'</div><p class="muted">Only apply a signature you are authorised to use. This is not a certificate-based digital signature.</p><div class="actions"><button class="primary" onclick="saveSignature()">Save signature</button><button class="danger" onclick="removeSignature()">Remove signature</button><button onclick="closeSignature()">Cancel</button></div>';
 document.body.appendChild(el);el.addEventListener('cancel',e=>{e.preventDefault();closeSignature()});el.showModal();
 const c=$('signaturePad');
 const point=e=>{const r=c.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(600,(e.clientX-r.left)*600/r.width))*10)/10,Math.round(Math.max(0,Math.min(200,(e.clientY-r.top)*200/r.height))*10)/10]};
 c.addEventListener('pointerdown',e=>{if(sigPointer!==null||sigDraft.length>=80||sigDraft.reduce((n,s)=>n+s.length,0)>=1600)return;e.preventDefault();sigPointer=e.pointerId;c.setPointerCapture(e.pointerId);sigDraft.push([point(e)]);paintSignature()});
 c.addEventListener('pointermove',e=>{if(sigPointer!==e.pointerId)return;const stroke=sigDraft[sigDraft.length-1];if(!stroke||sigDraft.reduce((n,s)=>n+s.length,0)>=1600)return;const p=point(e),last=stroke[stroke.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])<1)return;stroke.push(p);paintSignature()});
 const stop=e=>{if(sigPointer===e.pointerId)sigPointer=null};c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);c.addEventListener('lostpointercapture',stop);paintSignature();
}
function paintSignature(){
 const c=$('signaturePad');if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.scale(2,2);ctx.strokeStyle='#152d55';ctx.fillStyle='#152d55';ctx.lineWidth=4.5;ctx.lineCap='round';ctx.lineJoin='round';
 for(const stroke of sigDraft){if(!stroke.length)continue;ctx.beginPath();if(stroke.length===1){ctx.arc(stroke[0][0],stroke[0][1],2.25,0,Math.PI*2);ctx.fill()}else{ctx.moveTo(...stroke[0]);for(const p of stroke.slice(1))ctx.lineTo(...p);ctx.stroke()}}ctx.restore();
}
function clearSignature(){sigPointer=null;sigDraft=[];paintSignature()}
function undoSignature(){sigPointer=null;sigDraft.pop();paintSignature()}
function useSavedSignature(){if(validSignature(db.defaultSignature)){sigDraft=JSON.parse(JSON.stringify(db.defaultSignature));paintSignature()}}
function storeSignature(value){
 const obj=sigTarget==='default'?db:db.invoices.find(x=>x.id===sigBillId);if(!obj)return closeSignature();
 const key=sigTarget==='default'?'defaultSignature':'signature',old=obj[key];
 if(value===undefined)delete obj[key];else obj[key]=JSON.parse(JSON.stringify(value));
 if(!persist()){if(old===undefined)delete obj[key];else obj[key]=old;return}
 closeSignature();render();toast(value===undefined?'Signature removed':'Signature saved');
}
function saveSignature(){if(!validSignature(sigDraft))return toast('Draw your signature first');storeSignature(sigDraft)}
function removeSignature(){if(confirm('Remove this saved signature? Previously exported copies will not change.'))storeSignature(undefined)}


function billDocumentTitle(i){return i.kind==='quote'?'QUOTATION':i.taxMode==='none'?'':'TAX INVOICE'}
function validShopLogo(v){return typeof v==='string'&&v.length<=36000&&/^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(v)}
function shopLogoHtml(v){return validShopLogo(v)?'<img class="shop-logo" alt="Shop logo" src="'+v+'">':''}
function shopLogoField(id,v){v=validShopLogo(v)?v:'';return '<div class="shop-logo-field"><label>Shop logo (optional)</label><div id="'+id+'Preview" class="shop-logo-preview">'+(shopLogoHtml(v)||'<span class="muted">No logo selected</span>')+'</div><input type="hidden" id="'+id+'" value="'+esc(v)+'"><input type="file" class="hidden" id="'+id+'File" accept="image/jpeg,image/png,image/webp" onchange="chooseShopLogo(this,\''+id+'\')"><div class="actions"><button type="button" class="small" onclick="$(\''+id+'File\').click()">Choose logo</button><button type="button" class="small" onclick="removeShopLogo(\''+id+'\')">Remove logo</button></div><p class="muted">Choose a JPG, PNG or WebP from your device. The logo is resized for invoices.</p></div>'}
function removeShopLogo(id){const field=$(id);if(!field)return;field.value='';$(id+'Preview').innerHTML='<span class="muted">No logo selected</span>';field.dataset.logoToken='removed'}
async function chooseShopLogo(input,id){
 const f=input.files&&input.files[0];input.value='';if(!f)return;
 const field=$(id);if(!field)return;const token=uid();field.dataset.logoToken=token;
 if(f.size>8000000||!['image/jpeg','image/png','image/webp'].includes(f.type))return toast('Choose a JPG, PNG or WebP image under 8 MB.');
 const url=URL.createObjectURL(f);
 try{
  const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
  if(!img.naturalWidth||!img.naturalHeight)throw Error('Invalid image');
  const ratio=Math.min(1,256/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*ratio));c.height=Math.max(1,Math.round(img.naturalHeight*ratio));
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
  let v=c.toDataURL('image/jpeg',0.88);for(const q of [0.75,0.6,0.45,0.3]){if(validShopLogo(v))break;v=c.toDataURL('image/jpeg',q)}
  if(!validShopLogo(v))throw Error('Logo too large');
  if($(id)!==field||field.dataset.logoToken!==token)return;field.value=v;$(id+'Preview').innerHTML=shopLogoHtml(v);toast('Logo ready. Save to apply.');
 }catch(e){toast('Could not read shop logo. Try a smaller image.')}finally{URL.revokeObjectURL(url)}
}
function useBusinessProfile(){capture();if(!db.business.name.trim())return toast('Save a business profile first.');if(!confirm('Replace the current bill shop details with your saved business profile?'))return;draft.business=JSON.parse(JSON.stringify(db.business));render()}

render();
