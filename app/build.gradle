plugins { id 'com.android.application' }

def signingNames = ['BILLNEXA_KEYSTORE_PATH','BILLNEXA_STORE_PASSWORD','BILLNEXA_KEY_ALIAS','BILLNEXA_KEY_PASSWORD']
def releaseSigned = signingNames.every { System.getenv(it) }
android {
    namespace 'in.pixelfire.billnexa'
    compileSdk 36
    defaultConfig {
        applicationId 'in.pixelfire.billnexa'
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName '1.9'
    }
    signingConfigs {
        if (releaseSigned) {
            release {
                storeFile file(System.getenv('BILLNEXA_KEYSTORE_PATH'))
                storePassword System.getenv('BILLNEXA_STORE_PASSWORD')
                keyAlias System.getenv('BILLNEXA_KEY_ALIAS')
                keyPassword System.getenv('BILLNEXA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigned) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
