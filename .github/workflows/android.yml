name: Build BillNexa APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Android SDK and Gradle
        run: |
          sdkmanager --version
          gradle --version
      - name: Build debug APK with bounded network retry
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$RUNNER_TEMP/billnexa-build.log"; then
              exit 0
            fi
            if ! grep -Eqi 'status code (429|502|503|504)|Too Many Requests|Read timed out|Connection reset' "$RUNNER_TEMP/billnexa-build.log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 45))"
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: BillNexa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
